<svg width="800" height="500" xmlns="http://www.w3.org/2000/svg">
  <style>
    .actor { fill:none; stroke:black; stroke-width:2; }
    .usecase { fill:white; stroke:black; stroke-width:2; }
    .text { font-family:Arial; font-size:14px; text-anchor:middle; }
  </style>

  <!-- Hranice systému -->
  <rect x="180" y="20" width="500" height="450" fill="none" stroke="black" stroke-width="2"></rect>
  <text x="430" y="45" class="text">Systém pro vyhledávání psychologů</text>

  <!-- Uživatel -->
  <circle cx="70" cy="90" r="20" class="actor"></circle>
  <line x1="70" y1="110" x2="70" y2="160" class="actor"></line>
  <line x1="40" y1="130" x2="100" y2="130" class="actor"></line>
  <line x1="70" y1="160" x2="45" y2="200" class="actor"></line>
  <line x1="70" y1="160" x2="95" y2="200" class="actor"></line>
  <text x="70" y="225" class="text">Uživatel</text>

  <!-- Psycholog -->
  <circle cx="760" cy="90" r="20" class="actor"></circle>
  <line x1="760" y1="110" x2="760" y2="160" class="actor"></line>
  <line x1="730" y1="130" x2="790" y2="130" class="actor"></line>
  <line x1="760" y1="160" x2="735" y2="200" class="actor"></line>
  <line x1="760" y1="160" x2="785" y2="200" class="actor"></line>
  <text x="760" y="225" class="text">Psycholog</text>

  <!-- Use Cases -->
  <ellipse cx="330" cy="100" rx="100" ry="30" class="usecase"></ellipse>
  <text x="330" y="105" class="text">Vyhledat psychologa</text>

  <ellipse cx="330" cy="180" rx="100" ry="30" class="usecase"></ellipse>
  <text x="330" y="185" class="text">Zobrazit profil</text>

  <ellipse cx="330" cy="260" rx="100" ry="30" class="usecase"></ellipse>
  <text x="330" y="265" class="text">Odeslat poptávku</text>

  <ellipse cx="530" cy="120" rx="100" ry="30" class="usecase"></ellipse>
  <text x="530" y="125" class="text">Správa profilu</text>

  <ellipse cx="530" cy="220" rx="100" ry="30" class="usecase"></ellipse>
  <text x="530" y="225" class="text">Nastavit dostupnost</text>

  <ellipse cx="530" cy="320" rx="100" ry="30" class="usecase"></ellipse>
  <text x="530" y="325" class="text">Přijmout poptávku</text>

  <!-- Vazby -->
  <line x1="90" y1="90" x2="230" y2="100" stroke="black"></line>
  <line x1="90" y1="130" x2="230" y2="180" stroke="black"></line>
  <line x1="90" y1="170" x2="230" y2="260" stroke="black"></line>

  <line x1="660" y1="120" x2="740" y2="100" stroke="black"></line>
  <line x1="660" y1="220" x2="740" y2="130" stroke="black"></line>
  <line x1="660" y1="320" x2="740" y2="170" stroke="black"></line>
</svg>