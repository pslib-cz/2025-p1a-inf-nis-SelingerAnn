<svg width="900" height="500" xmlns="http://www.w3.org/2000/svg">
    <style>
        .actor { font: 16px Arial; }
        .usecase { fill:white; stroke:black; stroke-width:2; }
        .line { stroke:black; stroke-width:1.5; }
    </style>

    <rect x="250" y="50" width="500" height="380" fill="none" stroke="black"></rect>

    <text x="450" y="80" font-size="20">Psychologický portál</text>

    <ellipse class="usecase" cx="500" cy="130" rx="110" ry="25"></ellipse>
    <text x="430" y="135">Vyhledat psychologa</text>

    <ellipse class="usecase" cx="500" cy="200" rx="110" ry="25"></ellipse>
    <text x="450" y="205">Rezervovat termín</text>

    <ellipse class="usecase" cx="500" cy="270" rx="110" ry="25"></ellipse>
    <text x="445" y="275">Správa profilu</text>

    <ellipse class="usecase" cx="500" cy="340" rx="110" ry="25"></ellipse>
    <text x="420" y="345">Správa dostupnosti</text>

    <ellipse class="usecase" cx="500" cy="400" rx="110" ry="25"></ellipse>
    <text x="455" y="405">Administrace</text>

    <text class="actor" x="50" y="150">Uživatel</text>
    <line class="line" x1="150" y1="145" x2="390" y2="130"></line>
    <line class="line" x1="150" y1="145" x2="390" y2="200"></line>

    <text class="actor" x="50" y="320">Psycholog</text>
    <line class="line" x1="150" y1="315" x2="390" y2="270"></line>
    <line class="line" x1="150" y1="315" x2="390" y2="340"></line>

    <text class="actor" x="780" y="220">Administrátor</text>
    <line class="line" x1="730" y1="220" x2="610" y2="400"></line>
</svg>